<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТехноЛис | Создание сайтов</title>
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #121216;
            --bg-card: #1a1a20;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --accent: #ff6b00;
            --accent-light: #ff9500;
            --border: rgba(255, 107, 0, 0.2);
            --glow: 0 0 20px rgba(255, 107, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--accent);
        }

        p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: var(--accent);
            color: #fff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦊 ТехноЛис</h1>
        <p>Создание сайтов на чистом коде. Быстро, красиво, надёжно.</p>
        <a href="#" class="btn">Обсудить проект</a>
    </div>
</body>
</html>
